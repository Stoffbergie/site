[package]
name = "site"
version = "0.3.0"
edition = "2024"
authors = ["Dirk Beukes"]
description = "Static sites, live in one command"
license = "MIT"
repository = "https://github.com/Stoffbergie/site"
keywords = ["cli", "static-site", "deploy", "hosting"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.105"
base64 = "0.23.1"
brotli-decompressor = "6.4.0"
clap = { version = "4.6.10", features = ["derive"] }
dirs = "7.0.0"
flate2 = "1.1.11"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "json"] }
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"
