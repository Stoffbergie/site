[package]
name = "site"
version = "0.3.0"
edition = "2024"
authors = ["Dirk Beukes"]
description = "Static sites, live in one command"
license = "MIT"
repository = "https://github.com/Stoffbergie/site"
keywords = ["cli", "static-site", "deploy", "hosting"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.105"
base64 = "0.23.1"
brotlic = "0.8.4"
dirs = "7.0.0"
flate2 = "1.1.11"
getrandom = "0.4.3"
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.2", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"
