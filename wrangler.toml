name = "site"
main = "src/worker.ts"
compatibility_date = "2026-11-23"
account_id = "628c0e516646e33b3f22f2e8741bf0a5"
workers_dev = false
upload_source_maps = true

routes = [{ pattern = "site.stoff.dev", custom_domain = true }, { pattern = "*.site.stoff.dev/*", zone_name = "stoff.dev" }]

[vars]
SITE_DOMAIN = "site.stoff.dev"

[observability]
enabled = true
head_sampling_rate = 0.1

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

[[r2_buckets]]
binding = "SITES"
bucket_name = "site-files"

[[ratelimits]]
name = "DEPLOYS"
namespace_id = "2006"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "LOOKUPS"
namespace_id = "2007"
simple = { limit = 300, period = 60 }

[env.staging]
name = "site-staging"
routes = [{ pattern = "site-staging.stoff.dev", custom_domain = true }, { pattern = "*.site-staging.stoff.dev/*", zone_name = "stoff.dev" }]

[env.staging.vars]
SITE_DOMAIN = "site-staging.stoff.dev"

[[env.staging.r2_buckets]]
binding = "SITES"
bucket_name = "site-staging-files"

[[env.staging.ratelimits]]
name = "DEPLOYS"
namespace_id = "2008"
simple = { limit = 30, period = 60 }

[[env.staging.ratelimits]]
name = "LOOKUPS"
namespace_id = "2009"
simple = { limit = 300, period = 60 }
