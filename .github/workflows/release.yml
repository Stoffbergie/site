name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.2.0"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify Release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' cli/Cargo.toml | head -1)
          test "$VERSION" = "$cargo_version"

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: [verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: blacksmith-4vcpu-ubuntu-2404
            name: site-x86_64-unknown-linux-gnu
          - target: x86_64-unknown-linux-musl
            os: blacksmith-4vcpu-ubuntu-2404
            name: site-x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-gnu
            os: blacksmith-4vcpu-ubuntu-2404
            name: site-aarch64-unknown-linux-gnu
          - target: x86_64-apple-darwin
            os: macos-latest
            name: site-x86_64-apple-darwin
          - target: aarch64-apple-darwin
            os: macos-latest
            name: site-aarch64-apple-darwin
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: site-x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: cli

      - name: Build
        working-directory: cli
        run: cargo build --release --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package (Unix)
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          NAME: ${{ matrix.name }}
        run: |
          mkdir -p dist
          cp "cli/target/$TARGET/release/site" dist/
          cp LICENSE dist/
          cp README.md dist/
          cd dist
          tar -czvf "../$NAME.tar.gz" ./*

      - name: Validate package (Unix)
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          NAME: ${{ matrix.name }}
        run: |
          tar -tzf "$NAME.tar.gz"
          test -x dist/site
          case "$TARGET" in
            x86_64-unknown-linux-gnu|x86_64-unknown-linux-musl)
              ./dist/site --version
              ;;
            x86_64-apple-darwin)
              if [ "$(uname -m)" = "x86_64" ]; then ./dist/site --version; fi
              ;;
            aarch64-apple-darwin)
              if [ "$(uname -m)" = "arm64" ]; then ./dist/site --version; fi
              ;;
          esac

      - name: Package (Windows)
        if: runner.os == 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          NAME: ${{ matrix.name }}
        run: |
          mkdir dist
          cp "cli/target/${env:TARGET}/release/site.exe" dist/
          cp LICENSE dist/
          cp README.md dist/
          cd dist
          7z a -tzip "../${env:NAME}.zip" ./*

      - name: Validate package (Windows)
        if: runner.os == 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          NAME: ${{ matrix.name }}
        run: |
          7z l "${env:NAME}.zip"
          Test-Path dist/site.exe
          dist/site.exe --version

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip

  release:
    name: Create Release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [verify, build]
    permissions:
      contents: write
    outputs:
      version: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir release
          for dir in artifacts/*/; do
            cp "$dir"/* release/
          done
          cd release
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Validate release files
        run: |
          test -f release/site-x86_64-unknown-linux-gnu.tar.gz
          test -f release/site-x86_64-unknown-linux-musl.tar.gz
          test -f release/site-aarch64-unknown-linux-gnu.tar.gz
          test -f release/site-x86_64-apple-darwin.tar.gz
          test -f release/site-aarch64-apple-darwin.tar.gz
          test -f release/site-x86_64-pc-windows-msvc.zip
          test -f release/SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ needs.verify.outputs.version }}
          name: v${{ needs.verify.outputs.version }}
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
