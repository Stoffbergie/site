name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true

      - run: vp exec playwright install --with-deps chromium firefox webkit

      - run: vp run check

      - run: vp run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test
        run: |
          key="site_$(openssl rand -hex 16)"
          echo "<h1>site smoke $GITHUB_SHA</h1>" > smoke.html
          url=$(curl -fsS --retry 10 --retry-delay 3 --retry-all-errors -T smoke.html -H "Authorization: Bearer $key" https://site.stoff.dev)
          id=$(echo "$url" | sed -E "s#https://([a-z0-9]+)\..*#\1#")
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$url/" | grep -q "site smoke $GITHUB_SHA"
          curl -fsS -X DELETE -H "Authorization: Bearer $key" "https://site.stoff.dev/deploys/$id"
